<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Teka-Teki Silang</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
  }
  h1 {
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }
  .info {
    color: white;
    margin-bottom: 15px;
    font-size: 14px;
  }
  .container {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(10, 40px);
    grid-template-rows: repeat(10, 40px);
    background: #fff;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .cell {
    width: 40px;
    height: 40px;
    border: 1px solid #ccc;
    position: relative;
    background: #fff;
  }
  .cell.black { background: #333; border-color: #333; }
  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    background: transparent;
    outline: none;
    color: #2c3e50;
    caret-color: #667eea;
  }
  .cell input:focus {
    background: #fff3a3;
  }
  .cell .num {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 10px;
    color: #667eea;
    font-weight: bold;
    pointer-events: none;
  }
  .clues {
    display: flex;
    gap: 20px;
    color: white;
    max-width: 500px;
  }
  .clues div { flex: 1; }
  .clues h3 {
    border-bottom: 2px solid rgba(255,255,255,0.5);
    padding-bottom: 5px;
  }
  .clues li {
    margin-bottom: 6px;
    font-size: 13px;
    line-height: 1.3;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
  }
  .clues li:hover { background: rgba(255,255,255,0.2); }
  .clues li.done { text-decoration: line-through; opacity: 0.6; }
  .btn {
    margin-top: 15px;
    padding: 10px 25px;
    background: #fff;
    color: #667eea;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .btn:hover { transform: scale(1.05); }
  #message {
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    min-height: 30px;
  }
</style>
</head>
<body>

<h1>🧩 Teka-Teki Silang</h1>
<div class="info">Klik kotak lalu ketik jawaban. Tekan <b>Enter</b> untuk cek otomatis.</div>

<div class="container">
  <div class="board" id="board"></div>
  <div class="clues">
    <div>
      <h3>➡️ Mendatar</h3>
      <ol id="across"></ol>
    </div>
    <div>
      <h3>⬇️ Menurun</h3>
      <ol id="down"></ol>
    </div>
  </div>
</div>

<div id="message"></div>
<button class="btn" onclick="resetGame()">🔄 Ulangi</button>

<script>
// Ukuran papan
const SIZE = 10;

// Definisi kata: {row, col, dir, answer, clue}
// dir: 'A' = across (mendatar), 'D' = down (menurun)
const words = [
  { row: 0, col: 0, dir: 'A', answer: 'KUCING',  clue: 'Hewan berkaki empat yang mengeong' },
  { row: 0, col: 0, dir: 'D', answer: 'KAMAR',   clue: 'Ruangan untuk tidur' },
  { row: 0, col: 4, dir: 'D', answer: 'GUNUNG',  clue: 'Dataran yang sangat tinggi' },
  { row: 2, col: 0, dir: 'A', answer: 'MAKAN',   clue: 'Kegiatan memasukkan makanan ke mulut' },
  { row: 2, col: 5, dir: 'D', answer: 'NANAS',   clue: 'Buah berduri, manis asam' },
  { row: 4, col: 2, dir: 'A', answer: 'BUNGA',   clue: 'Bagian tumbuhan yang indah & berwarna' },
  { row: 4, col: 2, dir: 'D', answer: 'BUKU',    clue: 'Kumpulan lembaran kertas untuk dibaca' },
  { row: 6, col: 0, dir: 'A', answer: 'SEPEDA',  clue: 'Kendaraan beroda dua yang dikayuh' },
  { row: 6, col: 1, dir: 'D', answer: 'EMAS',    clue: 'Logam mulia berwarna kuning' },
  { row: 8, col: 3, dir: 'A', answer: 'AYAM',    clue: 'Hewan yang berkokok di pagi hari' },
];

// Grid data
let grid = [];
let cellNumbers = {};
let inputs = {};

function initGrid() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  cellNumbers = {};

  let num = 1;
  const startPoints = {};

  // Tentukan titik mulai & nomor
  words.forEach(w => {
    const key = `${w.row},${w.col}`;
    if (!startPoints[key]) {
      startPoints[key] = num++;
    }
  });

  // Isi grid
  words.forEach(w => {
    for (let i = 0; i < w.answer.length; i++) {
      const r = w.dir === 'A' ? w.row : w.row + i;
      const c = w.dir === 'A' ? w.col + i : w.col;
      if (r < SIZE && c < SIZE) {
        grid[r][c] = {
          answer: w.answer[i],
          words: grid[r][c] ? [...grid[r][c].words, w] : [w]
        };
      }
    }
  });

  // Set nomor pada grid
  for (const key in startPoints) {
    const [r, c] = key.split(',').map(Number);
    cellNumbers[`${r},${c}`] = startPoints[key];
  }

  return startPoints;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  inputs = {};

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';

      if (grid[r][c]) {
        const num = cellNumbers[`${r},${c}`];
        if (num) {
          const numSpan = document.createElement('span');
          numSpan.className = 'num';
          numSpan.textContent = num;
          cell.appendChild(numSpan);
        }

        const input = document.createElement('input');
        input.maxLength = 1;
        input.dataset.row = r;
        input.dataset.col = c;
        input.addEventListener('input', onInput);
        input.addEventListener('keydown', onKeyDown);
        input.addEventListener('focus', () => highlightClue(r, c));
        cell.appendChild(input);
        inputs[`${r},${c}`] = input;
      } else {
        cell.classList.add('black');
      }

      board.appendChild(cell);
    }
  }
}

function renderClues(startPoints) {
  const acrossList = document.getElementById('across');
  const downList = document.getElementById('down');
  acrossList.innerHTML = '';
  downList.innerHTML = '';

  // Urutkan berdasarkan nomor
  const sorted = words.map(w => ({
    ...w,
    num: startPoints[`${w.row},${w.col}`]
  })).sort((a, b) => a.num - b.num);

  sorted.forEach(w => {
    const li = document.createElement('li');
    li.textContent = `${w.num}. ${w.clue} (${w.answer.length})`;
    li.dataset.num = w.num;
    li.dataset.dir = w.dir;
    li.onclick = () => focusWord(w);
    if (w.dir === 'A') acrossList.appendChild(li);
    else downList.appendChild(li);
  });
}

function focusWord(w) {
  const key = `${w.row},${w.col}`;
  if (inputs[key]) inputs[key].focus();
}

function onInput(e) {
  const val = e.target.value.toUpperCase();
  e.target.value = val.replace(/[^A-Z]/g, '');

  // Auto pindah ke kanan jika mendatar
  if (e.target.value) {
    const r = +e.target.dataset.row;
    const c = +e.target.dataset.col;
    const next = inputs[`${r},${c + 1}`];
    if (next) next.focus();
  }
  checkAnswers();
}

function onKeyDown(e) {
  const r = +e.target.dataset.row;
  const c = +e.target.dataset.col;

  if (e.key === 'Backspace' && !e.target.value) {
    const prev = inputs[`${r},${c - 1}`];
    if (prev) { prev.focus(); prev.value = ''; }
  }
  if (e.key === 'ArrowRight') { const n = inputs[`${r},${c + 1}`]; if (n) n.focus(); }
  if (e.key === 'ArrowLeft')  { const n = inputs[`${r},${c - 1}`]; if (n) n.focus(); }
  if (e.key === 'ArrowDown')  { const n = inputs[`${r + 1},${c}`]; if (n) n.focus(); }
  if (e.key === 'ArrowUp')    { const n = inputs[`${r - 1},${c}`]; if (n) n.focus(); }
  if (e.key === 'Enter') {
    e.preventDefault();
    const next = inputs[`${r + 1},${c}`];
    if (next) next.focus();
  }
}

function highlightClue(r, c) {
  // Cari kata yang cocok untuk highlight (opsional)
  document.querySelectorAll('.clues li').forEach(li => li.style.fontWeight = 'normal');
}

function checkAnswers() {
  let allCorrect = true;
  let filled = 0, total = 0;

  words.forEach(w => {
    let correct = true;
    for (let i = 0; i < w.answer.length; i++) {
      const r = w.dir === 'A' ? w.row : w.row + i;
      const c = w.dir === 'A' ? w.col + i : w.col;
      const input = inputs[`${r},${c}`];
      if (!input) continue;
      total++;
      if (input.value) filled++;
      if (input.value.toUpperCase() !== w.answer[i]) correct = false;
    }

    // Tandai clue selesai
    const li = document.querySelector(`.clues li[data-num="${cellNumbers[`${w.row},${w.col}`]}"][data-dir="${w.dir}"]`);
    if (li) li.classList.toggle('done', correct);
  });

  if (filled === total && allCorrect) {
    document.getElementById('message').textContent = '🎉 Selamat! Semua jawaban benar! 🎉';
  } else {
    document.getElementById('message').textContent = `Terisi: ${filled}/${total}`;
  }
}

function resetGame() {
  Object.values(inputs).forEach(inp => inp.value = '');
  document.getElementById('message').textContent = '';
  document.querySelectorAll('.clues li').forEach(li => li.classList.remove('done'));
  const first = Object.values(inputs)[0];
  if (first) first.focus();
}

// Mulai game
const startPoints = initGrid();
renderBoard();
renderClues(startPoints);
checkAnswers();
</script>
</body>
</html>
